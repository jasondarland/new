name = "new"
main = "src/worker/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"

# IMPORTANT:
# Do not commit placeholder D1 IDs. Workers Builds validates D1 bindings at deploy time.
# Configure D1 binding `DB` in Cloudflare dashboard for CI, or add a real database_id
# here for manual/local wrangler deploys.

[[r2_buckets]]
binding = "R2"
bucket_name = "ssi-files"
preview_bucket_name = "ssi-files-preview"

[vars]
APP_NAME = "Show Systems International Portal"
JWT_ISSUER = "ssi-platform"
TURNSTILE_VERIFY_URL = "https://challenges.cloudflare.com/turnstile/v0/siteverify"
